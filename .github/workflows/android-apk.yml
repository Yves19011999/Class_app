name: Build Classe APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer les fichiers web
        run: npm run prepare:web

      - name: Créer le projet Android Capacitor
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Préparer la signature Android stable
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p android/keystore
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/classe-upload.jks
            echo "ANDROID_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/classe-upload.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "Aucune clé stable configurée : build debug temporaire."
          fi
          npm run android:signing
          npm run android:version

      - name: Activer les permissions Android nécessaires
        run: npm run android:permissions

      - name: Construire l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Vérifier l'APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Classe-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
