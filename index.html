<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Classe</title>
<meta name="theme-color" content="#102A43">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Classe">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --ardoise:#1E2A2F;
    --ardoise-2:#26343A;
    --ardoise-3:#324449;
    --craie:#F5F1E6;
    --craie-2:#EBE5D6;
    --papier:#FFFDF8;
    --terre:#B85C3E;
    --terre-fonce:#95492F;
    --emeraude:#4A7C5D;
    --emeraude-fonce:#396249;
    --ocre:#D4A843;
    --ocre-fonce:#B08A2F;
    --encre:#2B2620;
    --encre-douce:#6B6255;
    --ligne:#DED6C2;
    --rouge:#B8483F;
    --radius-s:6px;
    --radius-m:10px;
    --radius-l:16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-num: "SF Mono", "Roboto Mono", Consolas, monospace;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    background:var(--craie);
    color:var(--encre);
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit; font-size:16px;}

  /* ---------- App shell ---------- */
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--craie);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--ardoise);
    color:var(--craie);
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .topbar .eyebrow{
    font-size:13px;
    color:#B9C4C4;
    margin:0 0 2px;
    letter-spacing:.02em;
  }
  .topbar h1{
    margin:0;
    font-size:22px;
    font-weight:650;
    letter-spacing:-.01em;
  }
  .topbar .sub{
    margin-top:2px;
    font-size:13.5px;
    color:#9FB0AD;
  }

  /* ---------- Content ---------- */
  .view{
    flex:1;
    padding:18px 18px 100px;
    animation:riseIn .28s ease both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .view.hidden{display:none;}

  h2.section-title{
    font-size:15px;
    font-weight:650;
    color:var(--encre);
    margin:22px 0 10px;
  }
  h2.section-title:first-child{margin-top:2px;}

  /* ---------- Cards ---------- */
  .card{
    background:var(--papier);
    border:1px solid var(--ligne);
    border-radius:var(--radius-m);
    padding:16px;
  }
  .card + .card{margin-top:10px;}

  /* ---------- Hero: "Aujourd'hui" ---------- */
  .hero{
    background:linear-gradient(160deg, var(--ardoise) 0%, var(--ardoise-2) 55%, #2C3B3F 100%);
    color:var(--craie);
    border-radius:var(--radius-l);
    padding:20px 20px 18px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:150px; height:150px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(184,92,62,.35), transparent 70%);
  }
  .hero .hero-label{
    font-size:12.5px;
    color:#A9B7B4;
    margin:0 0 6px;
  }
  .hero .hero-main{
    display:flex;
    align-items:baseline;
    gap:10px;
    position:relative;
    z-index:1;
  }
  .hero .hero-main .num{
    font-family:var(--font-num);
    font-size:34px;
    font-weight:700;
    letter-spacing:-.02em;
  }
  .hero .hero-main .lab{
    font-size:15px;
    color:#CBD5D2;
  }
  .hero .hero-note{
    margin-top:10px;
    font-size:13.5px;
    color:#B9C4C4;
    position:relative; z-index:1;
  }
  .hero-empty{
    font-size:14.5px;
    color:#C7D0CD;
    position:relative; z-index:1;
  }

  .now-session{
    margin-top:14px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.12);
    border-radius:var(--radius-m);
    padding:12px 14px;
    position:relative; z-index:1;
  }
  .now-session .tag{
    display:inline-block;
    font-size:11.5px;
    background:var(--terre);
    color:#fff;
    padding:2px 8px;
    border-radius:20px;
    margin-bottom:6px;
  }
  .now-session .cls{
    font-size:16px;
    font-weight:600;
  }
  .now-session .time{
    font-size:13px;
    color:#B9C4C4;
    margin-top:2px;
  }

  /* ---------- Quick actions ---------- */
  .quick-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
  }
  .quick-btn{
    background:var(--papier);
    border:1px solid var(--ligne);
    border-radius:var(--radius-m);
    padding:12px 6px 10px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    cursor:pointer;
    transition:transform .12s ease, border-color .12s ease;
  }
  .quick-btn:active{transform:scale(.95);}
  .quick-btn svg{width:20px; height:20px; stroke:var(--ardoise);}
  .quick-btn span{font-size:11.5px; color:var(--encre-douce); font-weight:600; line-height:1.2;}

  /* ---------- List rows ---------- */
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
  }
  .row + .row{border-top:1px solid var(--ligne);}
  .avatar{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--ardoise-3);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:13.5px; font-weight:650;
    flex-shrink:0;
  }
  .row-main{flex:1; min-width:0;}
  .row-title{font-size:15px; font-weight:600; color:var(--encre);}
  .row-sub{font-size:12.5px; color:var(--encre-douce); margin-top:1px;}
  .row-end{flex-shrink:0;}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:var(--radius-s);
    padding:10px 16px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .12s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--terre); color:#fff;}
  .btn-primary:active{background:var(--terre-fonce);}
  .btn-ghost{background:transparent; color:var(--ardoise); border:1px solid var(--ligne);}
  .btn-emerald{background:var(--emeraude); color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:13px;}
  .btn-icon{
    width:36px; height:36px;
    border-radius:50%;
    background:var(--craie-2);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .btn-icon svg{width:17px; height:17px; stroke:var(--ardoise);}

  .fab{
    position:fixed;
    right:calc(50% - 280px + 20px);
    bottom:96px;
    width:54px; height:54px;
    border-radius:50%;
    background:var(--terre);
    color:#fff;
    border:none;
    box-shadow:0 4px 14px rgba(184,92,62,.4);
    display:flex; align-items:center; justify-content:center;
    z-index:25;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .fab:active{transform:scale(.92);}
  .fab svg{width:24px; height:24px; stroke:#fff; stroke-width:2.4;}
  @media (max-width:600px){
    .fab{right:20px;}
  }

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position:sticky;
    bottom:0;
    background:var(--ardoise);
    display:flex;
    padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);
    z-index:20;
    box-shadow:0 -1px 0 rgba(0,0,0,.2);
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    color:#8B9A97;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 2px 6px;
    cursor:pointer;
    border-radius:var(--radius-s);
  }
  .tab svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.8;}
  .tab span{font-size:10.5px; font-weight:600;}
  .tab.active{color:var(--terre);}
  .tab.active svg{stroke:var(--terre);}

  /* ---------- Chips / badges ---------- */
  .chip{
    display:inline-block;
    font-size:11.5px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
  }
  .chip-emerald{background:#E4EEE7; color:var(--emeraude-fonce);}
  .chip-ocre{background:#F6EAD1; color:var(--ocre-fonce);}
  .chip-rouge{background:#F5DFDC; color:var(--rouge);}
  .chip-neutral{background:var(--craie-2); color:var(--encre-douce);}

  /* ---------- Empty states ---------- */
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--encre-douce);
  }
  .empty svg{width:40px; height:40px; stroke:var(--ligne); margin-bottom:10px;}
  .empty p{margin:0; font-size:14px;}
  .empty .empty-action{margin-top:14px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--encre-douce);
    margin-bottom:5px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--ligne);
    border-radius:var(--radius-s);
    background:var(--papier);
    color:var(--encre);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--terre);
    outline-offset:-1px;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- Modal / sheet ---------- */
  .sheet-overlay{
    position:fixed; inset:0;
    background:rgba(30,42,47,.45);
    z-index:50;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .sheet-overlay.open{opacity:1; pointer-events:auto;}
  .sheet{
    background:var(--craie);
    width:100%;
    max-width:560px;
    max-height:88vh;
    border-radius:20px 20px 0 0;
    padding:14px 20px calc(env(safe-area-inset-bottom) + 20px);
    overflow-y:auto;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.32,.72,0,1);
  }
  .sheet-overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px;
    background:var(--ligne);
    border-radius:4px;
    margin:0 auto 14px;
  }
  .sheet-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .sheet-header h3{margin:0; font-size:17px; font-weight:650;}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(env(safe-area-inset-bottom) + 84px);
    transform:translate(-50%, 10px);
    background:var(--ardoise);
    color:var(--craie);
    padding:11px 18px;
    border-radius:30px;
    font-size:13.5px;
    font-weight:600;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .toast svg{width:15px; height:15px; stroke:var(--emeraude);}

  /* ---------- Attendance grid ---------- */
  .present-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 4px;
  }
  .present-row + .present-row{border-top:1px solid var(--ligne);}
  .status-btns{display:flex; gap:6px;}
  .status-btn{
    width:34px; height:34px;
    border-radius:50%;
    border:1.5px solid var(--ligne);
    background:var(--papier);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    color:var(--encre-douce);
  }
  .status-btn.p.on{background:var(--emeraude); border-color:var(--emeraude); color:#fff;}
  .status-btn.a.on{background:var(--rouge); border-color:var(--rouge); color:#fff;}
  .status-btn.r.on{background:var(--ocre); border-color:var(--ocre); color:#fff;}

  /* ---------- Schedule grid ---------- */
  .day-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:14px;
    scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex-shrink:0;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--ligne);
    background:var(--papier);
    font-size:13px;
    font-weight:600;
    color:var(--encre-douce);
    cursor:pointer;
  }
  .day-tab.active{background:var(--ardoise); color:var(--craie); border-color:var(--ardoise);}

  .slot{
    display:flex;
    gap:12px;
    padding:12px 4px;
    align-items:flex-start;
  }
  .slot + .slot{border-top:1px solid var(--ligne);}
  .slot-time{
    width:52px;
    flex-shrink:0;
    font-family:var(--font-num);
    font-size:12.5px;
    color:var(--encre-douce);
    padding-top:2px;
  }
  .slot-bar{
    width:3px;
    border-radius:3px;
    background:var(--terre);
    align-self:stretch;
    flex-shrink:0;
  }
  .slot-body{flex:1;}
  .slot-body .cls{font-size:14.5px; font-weight:650;}
  .slot-body .topic{font-size:12.5px; color:var(--encre-douce); margin-top:1px;}

  /* ---------- Homework list ---------- */
  .hw-card{
    background:var(--papier);
    border:1px solid var(--ligne);
    border-left:4px solid var(--ocre);
    border-radius:var(--radius-m);
    padding:14px 16px;
  }
  .hw-card.overdue{border-left-color:var(--rouge);}
  .hw-card.done{border-left-color:var(--emeraude); opacity:.7;}
  .hw-card + .hw-card{margin-top:10px;}
  .hw-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .hw-title{font-size:15px; font-weight:650;}
  .hw-meta{font-size:12.5px; color:var(--encre-douce); margin-top:3px;}
  .hw-desc{font-size:13.5px; color:var(--encre); margin-top:8px; line-height:1.45;}
  .hw-due{
    font-family:var(--font-num);
    font-size:11.5px;
    font-weight:700;
  }

  /* ---------- Grades ---------- */
  .grade-pill{
    font-family:var(--font-num);
    font-weight:700;
    font-size:14px;
    padding:4px 10px;
    border-radius:8px;
    min-width:44px;
    text-align:center;
  }
  .grade-good{background:#E4EEE7; color:var(--emeraude-fonce);}
  .grade-mid{background:#F6EAD1; color:var(--ocre-fonce);}
  .grade-low{background:#F5DFDC; color:var(--rouge);}

  /* ---------- Suggestions banner ---------- */
  .suggestion{
    background:#EEF3EC;
    border:1px solid #D3E0D0;
    border-radius:var(--radius-m);
    padding:12px 14px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .suggestion svg{width:17px; height:17px; stroke:var(--emeraude-fonce); flex-shrink:0; margin-top:1px;}
  .suggestion-text{font-size:13px; color:#3B4A3F; line-height:1.4;}
  .suggestion-text b{font-weight:650;}

  /* ---------- Search ---------- */
  .search-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--papier);
    border:1px solid var(--ligne);
    border-radius:var(--radius-s);
    padding:9px 12px;
    margin-bottom:14px;
  }
  .search-box svg{width:16px; height:16px; stroke:var(--encre-douce); flex-shrink:0;}
  .search-box input{border:none; background:none; padding:0; flex:1;}
  .search-box input:focus{outline:none;}

  /* ---------- Segmented control ---------- */
  .segmented{
    display:flex;
    background:var(--craie-2);
    border-radius:var(--radius-s);
    padding:3px;
    margin-bottom:14px;
  }
  .segmented button{
    flex:1;
    background:none;
    border:none;
    padding:8px 4px;
    font-size:12.5px;
    font-weight:650;
    color:var(--encre-douce);
    border-radius:6px;
    cursor:pointer;
  }
  .segmented button.active{background:var(--papier); color:var(--encre); box-shadow:0 1px 2px rgba(0,0,0,.08);}

  /* ---------- Student detail ---------- */
  .stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin:14px 0;
  }
  .stat-box{
    background:var(--papier);
    border:1px solid var(--ligne);
    border-radius:var(--radius-m);
    padding:12px 8px;
    text-align:center;
  }
  .stat-box .v{font-family:var(--font-num); font-size:19px; font-weight:700;}
  .stat-box .l{font-size:10.5px; color:var(--encre-douce); margin-top:2px;}

  /* ---------- Back header ---------- */
  .subheader{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .subheader h2{margin:0; font-size:18px; font-weight:650; flex:1;}


  /* ---------- UltraReview enhancements ---------- */
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;}
  .metric{background:var(--papier);border:1px solid var(--ligne);border-radius:var(--radius-m);padding:11px 7px;text-align:center;}
  .metric span{display:block;font-family:var(--font-num);font-size:18px;font-weight:750;color:var(--ardoise);}
  .metric small{display:block;margin-top:2px;font-size:10.5px;color:var(--encre-douce);line-height:1.15;}
  .filter-row{display:flex;gap:8px;align-items:flex-start;}
  .filter-row .day-tabs{flex:1;margin-bottom:14px;}
  .clickable{cursor:pointer;transition:background .12s ease,transform .1s ease;}
  .clickable:active{transform:scale(.99);}
  .clickable:hover{background:rgba(30,42,47,.025);}
  .mini-action{width:34px;height:34px;border:1px solid var(--ligne);border-radius:50%;background:var(--papier);color:var(--emeraude-fonce);font-weight:800;cursor:pointer;flex-shrink:0;}
  .slot-bar.is-now{background:var(--emeraude);}
  .slot-time span{opacity:.55;}
  .optional{font-weight:400;color:#9b9488;}
  .muted{font-size:13px;color:var(--encre-douce);line-height:1.45;}
  .sheet-kicker{margin:3px 0 0;font-size:12.5px;color:var(--encre-douce);font-weight:500;}
  .note-card{background:#F1F5F0;border:1px solid #D8E4D6;border-radius:var(--radius-m);padding:12px 14px;font-size:13.5px;line-height:1.45;margin:12px 0;}
  .attendance-summary{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0;font-size:11.5px;font-weight:650;}
  .attendance-summary span{background:var(--craie-2);padding:5px 9px;border-radius:20px;}
  .attendance-tools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;}
  .status-banner{border-radius:var(--radius-m);padding:12px 14px;font-size:13.5px;font-weight:650;margin:14px 0;}
  .status-banner.success{background:#E4EEE7;color:var(--emeraude-fonce);}
  .status-banner.warning{background:#F6EAD1;color:var(--ocre-fonce);}
  .status-banner.danger{background:#F5DFDC;color:var(--rouge);}
  .section-inline{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .section-inline .section-title{margin-top:2px;margin-bottom:10px;}
  .grade-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;}
  .sheet-actions{display:flex;gap:8px;margin-top:18px;}
  .sheet-actions .btn{flex:1;}
  .settings-section{background:var(--papier);border:1px solid var(--ligne);border-radius:var(--radius-m);padding:14px;margin-bottom:12px;}
    .install-card{background:linear-gradient(135deg,var(--ardoise),#2b3b42);color:#fff;border:0;box-shadow:var(--shadow);}
    .install-card .settings-title{color:#fff;}
    .install-card .muted{color:rgba(255,255,255,.78);}
